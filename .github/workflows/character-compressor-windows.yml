name: Character Compressor - Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/character-compressor
    paths:
      - .github/workflows/character-compressor-windows.yml
      - build-windows-vst3.ps1
      - projects/CharacterCompressor/Source/**
      - projects/CharacterCompressor/CMakeLists.txt

permissions:
  contents: read

concurrency:
  group: character-compressor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build VST3
        run: ./build-windows-vst3.ps1

      - name: Check Windows bundle
        run: |
          $bundle = 'build-character-win/CharacterCompressor_artefacts/Release/VST3/Character Compressor.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Character Compressor.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows VST3 binary missing: $binary"
          }
          Get-ChildItem -LiteralPath $bundle -Recurse

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: Character-Compressor-Windows-x64-VST3
          # Upload the parent directory to preserve the whole .vst3 bundle.
          path: build-character-win/CharacterCompressor_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30
