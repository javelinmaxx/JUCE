name: Yinyang Compressor and Shun De-Esser - Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/character-compressor
    paths:
      - .github/workflows/yinyang-shun-windows.yml
      - build-windows-vst3.ps1
      - projects/YinyangCompressor/Source/**
      - projects/YinyangCompressor/CMakeLists.txt
      - projects/ShunDeEsser/Source/**
      - projects/ShunDeEsser/CMakeLists.txt

permissions:
  contents: read

concurrency:
  group: j-sonic-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_yinyang:
    name: Yinyang Compressor Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build VST3
        run: ./build-windows-vst3.ps1

      - name: Check Windows bundle
        run: |
          $bundle = 'build-yinyang-win/YinyangCompressor_artefacts/Release/VST3/Yinyang Compressor.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Yinyang Compressor.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows VST3 binary missing: $binary"
          }
          Get-ChildItem -LiteralPath $bundle -Recurse

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: YinyangCompressor-Windows-x64-VST3
          # Upload the parent directory to preserve the whole .vst3 bundle.
          path: build-yinyang-win/YinyangCompressor_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30

  build_shun:
    name: Shun De-Esser Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Shun De-Esser
        run: |
          cmake -S projects/ShunDeEsser -B build-shun-win -G 'Visual Studio 17 2022' -A x64 '-DSHUN_DE_ESSER_BUILD_TESTS=OFF' '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          if ($LASTEXITCODE -ne 0) { throw "SHUN configuration failed (exit $LASTEXITCODE)." }

      - name: Build Shun De-Esser VST3
        run: |
          cmake --build build-shun-win --config Release --target ShunDeEsser_VST3 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "SHUN VST3 build failed (exit $LASTEXITCODE)." }

      - name: Check SHUN Windows bundle
        run: |
          $bundle = 'build-shun-win/ShunDeEsser_artefacts/Release/VST3/Shun De-Esser.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Shun De-Esser.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows VST3 binary missing: $binary"
          }
          Get-ChildItem -LiteralPath $bundle -Recurse

      - name: Upload SHUN Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: ShunDeEsser-Windows-x64-VST3
          path: build-shun-win/ShunDeEsser_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30
